<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harpia Adventure</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="main-container">
    <header class="header-container">
        <a href="#" class="header-button">
            <img src="./res/outros/logo-simpl.png" alt="Menu Icon">
        </a>

        <nav class="header-nav">
            <a href="#" class="font-format">HOME</a>
            <a href="#" class="font-format">ABOUT</a>
        </nav>

        <button class="header-button">
            <h4 style="margin: 0; padding: 10px 30px;" class="font-format">ENTRAR</h4>
        </button>
    </header>

    <div class="hero-carousel">
        <div class="gradiente-overlay"></div>
        <img id="imagem-cenario" src="./res/cenarios/aventurasAquaticas.png" alt="Cenário da Aventura">
    </div>

    <h1 class="font-format">Venha explorar conosco!</h1>
    <p class="font-format" style="text-align: center; margin: 0px; width: 80%;">A natureza chama. Descubra cenários de tirar o fôlego, viva experiências inesquecíveis e supere seus limites com o nosso catálogo exclusivo de aventuras.</p>
    
    <div class="aventuras-container">
        <h2 class="font-format">Nossas Aventuras</h2>
        <div class="seccao-filtros">
            <label for="filtro-dificuldade">Filtrar:</label>
            <select id="filtro-dificuldade" class="dropdown-filtro">
                <option value="todos">Todos os Níveis</option>
                <option value="facil">Iniciante</option>
                <option value="mediano">Intermediário</option>
                <option value="dificil">Difícil</option>
            </select>
        </div>

        <div id="grid-aventuras" class="grid-aventuras"></div>
    </div>

    <script src="app.js"></script>
    <footer class="footer-container">
        <a href="#" class="footer-button">
            <img src="./res/outros/logo.png" alt="Menu Icon">
        </a>
        <p>&copy; 2023 Harpia Adventure. All rights reserved.</p>
    </footer>
</body>
</html>
